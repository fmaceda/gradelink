name: Secret scan

# Every push to any branch and every PR to any base, so a leaked secret fails before it can merge
# (TASK-006). A PR branch is scanned twice (push and pull_request); a full scan takes seconds.
on:
  push:
  pull_request:

# Read-only: the scan only reads the repo.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Major tag: a GitHub-maintained action, and the project uses no automated update tooling
      # (RULES.md), so a major tag still picks up its fixes. Same choice as ci.yml.
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks scans every commit, not just the ones this event added.
          fetch-depth: 0
      # The allow-list is trusted only from the default branch, never from the commit being
      # scanned: otherwise a PR could add an [[allowlists]] entry for its own secret and pass. So a
      # new allow-list entry lands on main in its own PR first. Until main has a .gitleaks.toml,
      # the default rules alone apply (stricter, so the fallback can't hide a secret).
      - name: Load the gitleaks config from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # No --depth: a depth-limited fetch makes this full clone shallow, and gitleaks would
          # then silently skip the history behind the fetched commit.
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::The checkout is shallow, so gitleaks can't scan the full history."
            exit 1
          fi
          if ! git show FETCH_HEAD:.gitleaks.toml > "$RUNNER_TEMP/gitleaks.toml" 2>/dev/null; then
            echo "$DEFAULT_BRANCH has no .gitleaks.toml; using the default rules only."
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          fi
      # The gitleaks CLI image (MIT), not gitleaks-action: on push and pull_request events the action
      # scans only that event's commit range, and the full history must be scanned every run.
      # Pinned by version and digest because it's a third-party image that runs on our checkout.
      # --redact keeps any finding's value out of the public log. --config overrides the
      # .gitleaks.toml in the checkout, which gitleaks would otherwise pick up.
      - name: gitleaks (full history)
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          -v "$RUNNER_TEMP/gitleaks.toml:/config/gitleaks.toml:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /config/gitleaks.toml --redact --no-banner
